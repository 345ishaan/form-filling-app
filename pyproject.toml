[project]
name = "form-filling-app"
version = "0.1.0"
description = "Immigration case CMS — agent form filling harness"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",
    "gymnasium>=1.0.0",
    "numpy>=1.26.0",
    "pypdf2>=3.0.0",
    "pycryptodome>=3.20.0",
    "pdfplumber>=0.11.0",
    "modal>=1.3.1",
    "claude-agent-sdk>=0.1.20",
    "anthropic>=0.39.0",
    "httpx>=0.28.1",
    "aiohttp>=3.11.0",
    "websockets>=14.0",
    "python-dotenv>=1.1.0",
    "pydantic>=2.11.0",
    "nltk>=3.9.0",
    "liteparse>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
package = false
